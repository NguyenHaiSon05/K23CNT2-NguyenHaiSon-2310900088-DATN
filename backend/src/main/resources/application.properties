spring.application.name=rooms
server.port=8080

# K?t n?i MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/rooms?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
